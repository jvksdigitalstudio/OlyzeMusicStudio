name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ADR 0027: barrera de arquitectura. Verifica capas, ciclos, imports y
      # que :app solo dependa de eliner.api + eliner.composition. No necesita
      # Android ni Gradle (Python 3 estándar del runner) — falla en segundos,
      # antes de gastar minutos de NDK/Gradle en un cambio que rompe capas.
      - name: Verify architecture (layers, cycles, imports)
        run: python3 tools/verify_architecture.py

      # Referencias Kotlin: miembros inexistentes en el tipo declarado e imports ausentes.
      # Falla en segundos los errores de compilación más típicos de un cambio hecho sin
      # compilador (p. ej. llamar a un método de la clase concreta sobre una variable
      # tipada con su interfaz). Heurística calibrada, NO sustituye al compilador.
      - name: Verify Kotlin references (members, imports)
        run: python3 tools/verify_kotlin_references.py

      # Fase 1.1 (ADR 0021/0023): antes de este paso, esta pipeline no
      # ejecutaba NINGÚN test — ni Kotlin ni C++ — solo compilaba el APK.
      # La suite C++ standalone del núcleo (ADR 0016-0020, 0022) no
      # necesita NDK/Android: son unidades de traducción independientes
      # que se compilan con el g++ del runner y corren con ASan/UBSan/TSan
      # contra código de producción real (SynthVoice, VoicePool, TransportEngine y el
      # AudioEngine completo contra un backend de audio falso, ADR 0030) o réplicas
      # fieles de la lógica de AudioCommandDispatcher.kt (documentado en cada test por qué). Se ejecuta primero porque es lo
      # más rápido en fallar y no depende de nada más de este workflow.
      - name: Run native core test suite (no NDK required)
        run: bash eliner/src/test/cpp/run_native_tests.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          sdkmanager --install "cmake;3.22.1"

      - name: Generate Gradle Wrapper JAR
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --project-dir .
          chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache CMake build (Oboe FetchContent)
        uses: actions/cache@v5
        with:
          path: eliner/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('eliner/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      # Corre TODOS los tests Kotlin del proyecto (unit tests JVM, sin
      # emulador — incluye los de ADR 0016-0023, nunca ejecutados hasta
      # ahora fuera de este workflow porque el entorno de desarrollo de
      # esa fase no tenía kotlinc/JDK completo). No cubre los tests
      # instrumentados (androidTest) que requieren un emulador/dispositivo
      # real — ninguno existe todavía en este proyecto.
      - name: Run Kotlin unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload Kotlin unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-unit-test-reports-${{ github.sha }}
          path: '**/build/reports/tests/testDebugUnitTest/'
          retention-days: 30

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: OlyzeMusicStudio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v6
        with:
          name: OlyzeMusicStudio-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
